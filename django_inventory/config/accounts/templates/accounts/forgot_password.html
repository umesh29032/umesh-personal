{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Kapil Enterprises</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --ink: #0e0b09; --ink-2: #1c1814; --copper: #b87333; --copper-l: #d4924a; --cream: #f5ede0; --cream-2: #ede3d4; --stone: #7a6a58; --smoke: #c4b39e; --white: #faf7f2; }
        html, body { min-height: 100%; font-family: 'Syne', sans-serif; background: linear-gradient(160deg, #130428 0%, #240a52 50%, #100324 100%); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; position: relative; }
        body::before { content: ''; position: fixed; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(255,255,255,0.022) 28px, rgba(255,255,255,0.022) 29px), repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(255,255,255,0.022) 28px, rgba(255,255,255,0.022) 29px); pointer-events: none; }
        body::after { content: ''; position: fixed; top: -80px; right: -80px; width: 480px; height: 480px; background: radial-gradient(circle, rgba(184,115,51,0.18) 0%, rgba(120,60,20,0.06) 45%, transparent 70%); pointer-events: none; }

        .card { width: 100%; max-width: 420px; background: var(--cream); border-radius: 12px; overflow: hidden; position: relative; z-index: 1; opacity: 0; animation: riseIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }
        .card-accent { height: 3px; background: linear-gradient(to right, var(--ink-2), var(--copper), var(--copper-l), var(--copper)); }
        .card-body { padding: 44px 44px 40px; position: relative; z-index: 1; }

        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--stone); text-decoration: none; margin-bottom: 28px; transition: color 0.2s; }
        .back-link:hover { color: var(--copper); }
        .back-link svg { width: 14px; height: 14px; }

        .monogram { width: 48px; height: 48px; border: 1.5px solid var(--copper); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; position: relative; }
        .monogram::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(184,115,51,0.25); border-radius: 2px; }
        .monogram span { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--copper); }

        .heading { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; font-style: italic; color: var(--ink); line-height: 1.1; margin-bottom: 6px; }
        .heading em { font-style: normal; font-weight: 600; }
        .sub { font-size: 12px; font-weight: 500; color: var(--stone); letter-spacing: 0.03em; margin-bottom: 32px; line-height: 1.6; }

        .alerts { margin-bottom: 20px; }
        .alert { padding: 11px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; margin-bottom: 8px; line-height: 1.5; }
        .alert-error   { background: #fef1ee; color: #7c2d12; border-left: 3px solid #dc4533; }
        .alert-success { background: #f0fdf4; color: #14532d; border-left: 3px solid #22c55e; }
        .alert-info    { background: #eff6ff; color: #1e3a5f; border-left: 3px solid #3b82f6; }

        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--stone); margin-bottom: 8px; }
        .field input { width: 100%; padding: 14px 18px; background: var(--white); border: 1.5px solid var(--cream-2); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 400; color: var(--ink); outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
        .field input::placeholder { color: var(--smoke); }
        .field input:focus { border-color: var(--copper); box-shadow: 0 0 0 3px rgba(184,115,51,0.12); }

        .btn-cta { width: 100%; padding: 15px 24px; background: var(--ink); color: var(--cream); border: none; border-radius: 6px; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; transition: background 0.2s, transform 0.15s; }
        .btn-cta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 40%, rgba(184,115,51,0.15) 100%); }
        .btn-cta:hover { background: var(--ink-2); transform: translateY(-1px); }
        .btn-cta:active { transform: translateY(0); }

        .form-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; font-weight: 500; color: var(--stone); text-decoration: none; transition: color 0.2s; }
        .form-link:hover { color: var(--copper); }

        @keyframes riseIn { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        @media (max-width: 480px) { .card-body { padding: 32px 24px 28px; } .heading { font-size: 30px; } }
    </style>
</head>
<body>
<div class="card">
    <div class="card-accent"></div>
    <div class="card-body">
        <a href="{% url 'accounts:login_password' %}" class="back-link">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5l-5 5 5 5"/></svg>
            Back to Login
        </a>
        <div class="monogram"><span>KE</span></div>
        <h1 class="heading"><em>Reset</em> your<br>password.</h1>
        <p class="sub">Enter your work email and we'll send you a<br>one-time code to set a new password.</p>

        {% if messages %}
        <div class="alerts">{% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" placeholder="you@kapilenterprises.com" required autocomplete="email" autofocus>
            </div>
            <button type="submit" class="btn-cta">Send Reset Code →</button>
        </form>
        <a href="{% url 'accounts:login' %}" class="form-link">Back to OTP login</a>
    </div>
</div>
</body>
</html>
