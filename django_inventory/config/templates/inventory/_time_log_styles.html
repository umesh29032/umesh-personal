{# Shared time-log accordion styles. Include from extra_head wherever a <details class="time-log-accordion"> is rendered. #}
<style>
    .time-log-accordion {
        background: var(--card-bg);
        border: 1px solid var(--border-card);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
        overflow: hidden;
        transition: box-shadow 0.2s;
    }
    .time-log-accordion[open] { box-shadow: var(--shadow-card-hover); }

    .time-log-accordion summary {
        list-style: none;             /* Chromium default arrow hide */
        cursor: pointer;
        padding: 16px 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        user-select: none;
        background: var(--card-bg);
        border-bottom: 1px solid transparent;
        transition: background 0.15s, border-color 0.2s;
    }
    .time-log-accordion summary::-webkit-details-marker { display: none; }   /* Safari arrow hide */
    .time-log-accordion summary::marker { display: none; }                   /* Firefox marker hide */
    .time-log-accordion[open] summary { border-bottom-color: var(--border-card); }
    .time-log-accordion summary:hover { background: var(--surface-3); }

    .time-log-accordion .acc-title {
        font-family: inherit;
        font-size: 13px; font-weight: 700;
        color: var(--ink);
        letter-spacing: 0.04em; text-transform: uppercase;
    }
    .time-log-accordion .acc-sub {
        font-size: 11px; color: var(--stone);
        margin-left: auto;
    }
    .time-log-accordion .acc-chevron {
        font-size: 14px; color: var(--stone);
        transition: transform 0.2s;
        margin-left: 8px;
    }
    .time-log-accordion[open] .acc-chevron { transform: rotate(180deg); color: var(--copper); }

    .time-log-accordion .acc-body { padding: 14px 22px 18px; }

    .time-log-accordion ul.time-log { list-style: none; padding: 0; margin: 0; }
    .time-log-accordion ul.time-log li {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 13px;
    }
    .time-log-accordion ul.time-log li:last-child { border-bottom: 0; }
    .time-log-accordion ul.time-log .ts {
        color: var(--stone); font-size: 11px;
        font-family: 'Courier New', monospace;
    }
    .time-log-accordion ul.time-log strong { color: var(--ink); }
    .time-log-accordion ul.time-log .actor {
        color: var(--stone); font-size: 11px; margin-top: 2px;
    }

    /* Mobile — collapse columns to single column with smaller padding. */
    @media (max-width: 600px) {
        .time-log-accordion summary { padding: 14px 16px; flex-wrap: wrap; }
        .time-log-accordion .acc-sub { margin-left: 0; flex-basis: 100%; }
        .time-log-accordion .acc-body { padding: 12px 16px 16px; }
        .time-log-accordion ul.time-log li {
            grid-template-columns: 1fr; gap: 4px; padding: 12px 0;
        }
    }
</style>
