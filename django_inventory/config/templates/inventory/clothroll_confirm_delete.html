{% extends "accounts/base.html" %}

{% block page_title %}Delete Roll{% endblock %}

{% block content %}
<div class="confirm-card">
    <div class="confirm-card-head">
        <div class="confirm-icon confirm-icon-danger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>
        <h2>Delete Cloth Roll</h2>
    </div>
    <div class="confirm-card-body">
        <p>Are you sure you want to delete cloth roll <strong>{{ object.roll_number }}</strong>?</p>
        <p style="margin-top: 8px; color: var(--danger); font-size: 13px; font-weight: 600;">This action cannot be undone.</p>
    </div>
    <div class="confirm-card-foot">
        <form method="post" style="display: flex; gap: 10px; width: 100%; justify-content: flex-end;">
            {% csrf_token %}
            <a href="{% url 'inventory:cloth_roll_list' %}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-danger">Delete Roll</button>
        </form>
    </div>
</div>
{% endblock %}
