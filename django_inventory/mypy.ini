[mypy]
# LENIENT START (M0.2) — report-only in scripts/check.sh. No django-stubs yet.
# Global floor stays lenient (views/forms/migrations are not the contract surface).
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
exclude = (migrations/|/env/|/media/|/staticfiles/)
warn_unused_ignores = False
check_untyped_defs = False

# P6.4 — service-layer TYPED ISLAND (ratchet; still report-only via check.sh).
# The service layer is the cross-app contract surface, so this is where typing
# pays off. Stricter checks ONLY here (and the stage engine); the rest stays
# lenient — raise the floor without boiling the ocean. `*` matches across dotted
# packages, so this also covers config.<app>.services.* however mypy resolves it.
[mypy-*.services.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-*.stages.*]
disallow_untyped_defs = True
check_untyped_defs = True
