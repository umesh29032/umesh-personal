[mypy]
# LENIENT START (M0.2) — report-only in scripts/check.sh. No django-stubs yet.
# Tighten (disallow_untyped_defs, strict-optional scoping) after M2/M3 stabilize.
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
exclude = (migrations/|/env/|/media/|/staticfiles/)
warn_unused_ignores = False
check_untyped_defs = False
